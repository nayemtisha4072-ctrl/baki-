name: Build Baki Khata APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK 36.1 and Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -w "$SDK_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR"
          fi
          mkdir -p "$SDK_DIR/licenses"
          grep -qxF "24333f8a63b6825ea9c5514f83c2829b004d1fee" "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$SDK_DIR/licenses/android-sdk-license"
          grep -qxF "84831b9409646a918e30573bab4c9c91346d8abd" "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_DIR/licenses/android-sdk-preview-license"
          grep -qxF "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" "$SDK_DIR/licenses/google-gdk-license" 2>/dev/null || echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" >> "$SDK_DIR/licenses/google-gdk-license"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            set -o pipefail
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"
          fi

      - name: Prepare keystore and env file
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Baki Khata APK
        uses: actions/upload-artifact@v4
        with:
          name: BakiKhata-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
